spring.application.name=HandyVue
spring.application.cli=false

spring.application.elasticsearch.uris=http://localhost:9200
# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=org.handy.handyvue.dto

mybatis.configuration.map-underscore-to-camel-case=true

#Spring AI

#openAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-4.1-nano
spring.ai.openai.chat.base-url=https://models.github.ai/inference
spring.ai.openai.chat.completions-path=/chat/completions

#ollama
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.chat.model=hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF
spring.ai.ollama.embedding.options.model=bge-m3

# ?? ?? ? ?? ???? ??? ???? ??
spring.ai.ollama.vectorstore.elasticsearch.initialize-schema=true
# ?? ???? ??? ?????? ??? ??
spring.ai.ollama.vectorstore.elasticsearch.index-name=spring-ai-document-index
# bge-m3 ??? ?? ?? ?? ?? ? ?? (??)
spring.ai.ollama.vectorstore.elasticsearch.dimensions=1024
# ?? ?? ??(???)? ??? ?? ?? (??? ???)
spring.ai.ollama.vectorstore.elasticsearch.similarity=cosine

logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.tool=DEBUG

app.rag.documents-location-pattern=classpath:spring-ai-llm2.pdf
# true ? ??? ?? ??? ??? ???
app.etl.pipeline.init=false
# cli ??
app.cli.enabled=false
app.chat.default-system-prompt=???? ???? tool ?? AI ???.

app.vectorstore.in-memory.enabled=false